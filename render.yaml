services:
  - type: web
    name: my-kino-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "8617811346"
      - key: STORAGE_CHAT_ID
        value: "-1003918962533"
      - key: FORCE_CHANNELS
        value: ""
      - key: RECOMMEND_CHANNEL
        value: ""
      - key: RECOMMEND_URL
        value: ""
